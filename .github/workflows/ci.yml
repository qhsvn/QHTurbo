name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax + shellcheck
        run: |
          for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
          shellcheck -S warning -x scripts/*.sh tests/*.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py

  # Workloads must run unchanged on every supported PHP branch.
  workloads:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: Lint PHP workloads, training scripts and qht-doctor
        run: for f in benchmarks/workloads/*/main.php benchmarks/training/*.php scripts/qht-doctor.php; do php -l "$f"; done
      - name: Same output in PHP / Python / Node.js / Go
        run: tests/check-workloads.sh "$(command -v php)"
      - name: qht-doctor runs (exit 0 = ok, 1 = findings, anything else = crash)
        run: |
          set +e
          php scripts/qht-doctor.php --scan=runtime/examples; code=$?
          test $code -le 1

  # QHturbo Performance runtime, including the async Redis / MySQL clients
  # against real servers (MySQL 8.4 = caching_sha2_password authentication).
  runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qht
          MYSQL_USER: qht
          MYSQL_PASSWORD: qhtpass
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      QHT_TEST_REDIS: redis://127.0.0.1:6379/15
      QHT_TEST_MYSQL: mysql://qht:qhtpass@127.0.0.1:3306/qht
      QHT_TEST_REQUIRE_SERVERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pcntl, posix
          coverage: none
      - name: Lint runtime
        run: for f in $(find runtime -name '*.php') runtime/bin/qhturbo-serve; do php -l "$f" > /dev/null; done
      - name: Runtime tests (event loop, HTTP, workers, state, Redis, MySQL)
        run: php runtime/tests/run.php

  # Laravel and Symfony adapters against freshly created applications.
  frameworks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, pcntl, posix, pdo_sqlite, curl, intl
          coverage: none
          tools: composer
      - name: Create Laravel and Symfony apps
        run: |
          composer create-project --no-interaction --prefer-dist laravel/laravel /tmp/laravel
          composer create-project --no-interaction --prefer-dist symfony/skeleton /tmp/symfony
      - name: Framework adapter tests
        env:
          QHT_TEST_LARAVEL: /tmp/laravel
          QHT_TEST_SYMFONY: /tmp/symfony
        run: php runtime/tests/frameworks.php

  # Build the pinned upstream baseline + QHturbo patches, run a PHPT subset
  # and a quick benchmark smoke test.
  build-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
    env:
      QHT_PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf bison re2c pkg-config
      - run: scripts/bootstrap.sh
      - run: scripts/build.sh baseline
      - run: scripts/build.sh qhturbo
      - name: PHPT (Zend subset, OPcache on)
        run: |
          scripts/run-tests.sh qhturbo opcache Zend/tests
          cat results/tests/php$QHT_PHP-qhturbo-opcache/summary.md
      - name: Benchmark smoke
        run: python3 scripts/bench.py php --php "$QHT_PHP" --variants baseline,qhturbo --size quick --runs 3 --out /tmp/smoke
