; QHturbo OPcache profile for production web (PHP-FPM). Works on PHP 7.4 - 8.5.
; Starting point only: size the values from opcache_get_status() on staging.
;
; PHP < 8.5: OPcache is a shared extension; uncomment and point at the module.
; zend_extension=opcache.so

opcache.enable=1
opcache.enable_cli=0
; Memory for compiled scripts (MB). Raise if opcache_get_status() shows
; cache_full or a high restart count.
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
; Must exceed the number of PHP files in the deployed apps (vendor/ included).
opcache.max_accelerated_files=50000
; Deploys replace code atomically (symlink switch + FPM reload), so skip
; per-request stat() calls. Set to 1 on servers where files are edited in place.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.enable_file_override=1
