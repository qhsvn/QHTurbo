; QHturbo JIT profile (PHP >= 8.0 only; PHP 7.4 has no JIT and ignores these).
; Benchmark JIT on/off for each application before enabling it in production
; (see docs/phases/phase-04-compiler-jit.md). CPU-bound code gains the most;
; typical I/O-bound web requests gain little.
opcache.jit=tracing
opcache.jit_buffer_size=128M
