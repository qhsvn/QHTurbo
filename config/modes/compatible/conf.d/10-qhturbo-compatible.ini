; QHturbo Compatible mode: behave like a standard PHP-FPM install, only faster
; through safe OPcache defaults. Installed into @PREFIX@/etc/conf.d/.
@OPCACHE_EXTENSION@
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=50000
; Keep file-change detection ON so apps edited in place (FTP, panel file
; manager, WordPress updates) behave as before. Checked every 2 s.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1
; JIT stays off in Compatible mode (benchmark your app before enabling it).
@JIT_OFF@

; Fewer stat() calls for include-heavy apps (Composer autoload).
realpath_cache_size=4096K
realpath_cache_ttl=600

expose_php=Off
