; QHturbo pool. Its own socket, so it runs beside the aaPanel/distro PHP-FPM.
; Point an nginx vhost at it with:  fastcgi_pass unix:/run/qhturbo/php@PHPTAG@-fpm.sock;
[www]
user = @USER@
group = @GROUP@
listen = /run/qhturbo/php@PHPTAG@-fpm.sock
listen.owner = @USER@
listen.group = @GROUP@
listen.mode = 0660

; Size with scripts/fpm-tune.py: max_children = RAM for PHP / worker RSS.
pm = dynamic
pm.max_children = @MAX_CHILDREN@
pm.start_servers = @START_SERVERS@
pm.min_spare_servers = @MIN_SPARE@
pm.max_spare_servers = @MAX_SPARE@
; Recycle children periodically: protects against leaks in old code/extensions.
pm.max_requests = 1000

pm.status_path = /qhturbo-fpm-status
ping.path = /qhturbo-fpm-ping
request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/log/qhturbo/php@PHPTAG@-slow.log
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
