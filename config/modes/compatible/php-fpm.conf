; QHturbo PHP-FPM master configuration (@PREFIX@/etc/php-fpm.conf)
[global]
pid = /run/qhturbo/php@PHPTAG@-fpm.pid
error_log = /var/log/qhturbo/php@PHPTAG@-fpm.log
; Restart workers if many crash quickly (memory corruption, OOM, ...).
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

include = @PREFIX@/etc/php-fpm.d/*.conf
