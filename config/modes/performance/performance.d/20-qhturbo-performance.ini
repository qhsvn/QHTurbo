; QHturbo Performance mode overrides (loaded after conf.d/ by the worker
; service through PHP_INI_SCAN_DIR). Workers are long-lived CLI processes.
opcache.enable_cli=1
; Code only changes on deploy; deploy = SIGHUP reload (rolling restart).
opcache.validate_timestamps=0
@JIT_ON@
memory_limit=512M
max_execution_time=0
